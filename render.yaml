# ==============================================================================
# VERITRACE — Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec
#
# This file provisions all services for the VERITRACE Deepfake Detection System:
# 1. veritrace-frontend : Next.js tactical web UI
# 2. veritrace-backend  : Node.js Express & Socket.IO orchestration API
# 3. veritrace-ml       : Python PyTorch & Vision Transformer inference microservice
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Service (Next.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: veritrace-frontend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOST
        fromService:
          type: web
          name: veritrace-backend
          property: host
      - key: BACKEND_PORT
        fromService:
          type: web
          name: veritrace-backend
          property: port

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (Node.js Express + Socket.IO)
  # ----------------------------------------------------------------------------
  - type: web
    name: veritrace-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: deepfake-detection
      - key: ADMIN_EMAIL
        value: sankalpgaonkar23@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: veritrace-ml
          property: host
      - key: ML_MAX_INFERENCE_FRAMES
        value: "8"
      - key: DISABLE_AUDIO_MODEL
        value: "true"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: veritrace-frontend
          property: host

  # ----------------------------------------------------------------------------
  # 3. Machine Learning Inference Service (PyTorch / SigLIP)
  # ----------------------------------------------------------------------------
  - type: web
    name: veritrace-ml
    runtime: python
    rootDir: ml-service
    plan: free
    # Install CPU-only PyTorch first (saves ~600MB vs default CUDA build) with NumPy < 2.0.0,
    # then install remaining dependencies with all their sub-dependencies.
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.1.2+cpu torchvision==0.16.2+cpu "numpy>=1.24.0,<2.0.0" && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 300 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: ML_ENV
        value: production
      # Disable the audio model (wav2vec2, ~500MB) on Render free tier to avoid OOM
      - key: DISABLE_AUDIO_MODEL
        value: "true"
      - key: ML_MAX_FRAMES
        value: "8"
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      # Use /tmp for model cache (Render ephemeral disk)
      - key: TRANSFORMERS_CACHE
        value: /tmp/hf_cache
      - key: HF_HOME
        value: /tmp/hf_home
